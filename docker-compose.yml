# ─────────────────────────────────────────────────────────────────────────────
# PsyPredict — Docker Compose for LOCAL DEVELOPMENT
#
# Usage:
#   docker compose up --build
#
# This spins up all three services locally:
#   1. Ollama (LLM server with Llama3)
#   2. Backend (FastAPI + DistilBERT + Keras)
#   3. Frontend (Vite dev server)
#
# For production, the backend is deployed to HF Spaces (using Groq, not Ollama)
# and the frontend is deployed to Vercel.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Ollama (Local LLM Server) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend (FastAPI + Ollama + DistilBERT + Keras) ─────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "7860:7860"       # HF Spaces standard port — keep consistent locally too
    env_file:
      - ./backend/.env    # LLM_PROVIDER, OLLAMA_BASE_URL, etc.
    environment:
      # Override to use the Ollama container (not localhost)
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL_NAME=llama3
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s   # Allow time for model downloads on first run

  # ── Frontend (Vite Dev Server) ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      # Point to the local backend
      - VITE_BACKEND_URL=http://localhost:7860
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ──────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    # Stores downloaded Ollama models (~4.7 GB for llama3)
    # Persists across `docker compose down` so you don't re-download on every restart
