services:
  # 🐍 Backend Service
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      # This "syncs" your live code changes to the container
      - ./backend:/app
      - /app/venv
    env_file:
      - .env  # Reads your GOOGLE_API_KEY from the root .env file

  # ⚛️ Frontend Service
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      # This "syncs" your live code changes to the container
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend